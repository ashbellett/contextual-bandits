[project]
name = "contextual-bandits"
version = "0.2.0"
description = "Thompson sampling with Gaussian-process rewards in stationary and piecewise-stationary contextual bandits"
authors = [{ name = "Ash Bellett" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "threadpoolctl>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bandit"]

[tool.setuptools.package-data]
bandit = ["report_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
